# The Flutter template ships -Xmx8G -XX:MaxMetaspaceSize=4G, which assumes a
# 16-32 GB dev machine. This one has 7.7 GB total and shares it with a 2.4 GB
# emulator, so those defaults guarantee swapping and a build that crawls.
# 1.5 GB is comfortably enough for this project.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=false
org.gradle.caching=true
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
